<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" font-family="JetBrains Mono, monospace">
  <title>ogOCR · mobile portrait · output v2 wireframe</title>
  <desc>390x844 phone, output tab active. Each labelled group is named for clean import into Figma / Penpot / Affinity.</desc>

  <defs>
    <style>
      .frame    { fill: none; stroke: #2b2620; stroke-width: 1; }
      .region   { fill: #f4f3ee; stroke: #2b2620; stroke-width: 1; }
      .canvas   { fill: #fafaf7; stroke: #2b2620; stroke-width: 1; }
      .accent   { stroke: #4a52d6; }
      .accent-fill { fill: #4a52d6; }
      .label    { font-size: 11px; fill: #2b2620; letter-spacing: 0.06em; text-transform: uppercase; }
      .label-soft { font-size: 11px; fill: #5c574f; letter-spacing: 0.06em; }
      .label-faint { font-size: 10px; fill: #928d85; letter-spacing: 0.10em; text-transform: uppercase; }
      .h2       { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 18px; fill: #2b2620; }
      .pin      { fill: #4a52d6; }
      .pin-text { font-size: 11px; fill: #ffffff; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
      .scroll-axis { stroke: #4a52d6; stroke-width: 1.4; fill: none; }
      .scroll-axis-arrow { fill: #4a52d6; }
      .legend-row { font-size: 11px; fill: #2b2620; }
      .legend-meta { font-size: 10px; fill: #4a52d6; letter-spacing: 0.08em; text-transform: uppercase; }
      .dim-rule { stroke: #928d85; stroke-width: 0.5; stroke-dasharray: 2 3; }
    </style>
  </defs>

  <!-- Page background -->
  <rect width="720" height="900" fill="#ebe9e3"/>

  <!-- ──────────── Phone frame (390x844) at left, padded ──────────── -->
  <g id="phone-frame" transform="translate(28, 28)">
    <title>Phone frame · 390x844 · safe-area outline only</title>
    <rect class="frame" x="0" y="0" width="390" height="844" rx="38"/>

    <!-- Screen content layers -->
    <!-- 1. TopBar -->
    <g id="topbar">
      <title>1 · TopBar (44 px)</title>
      <rect class="region" x="0" y="0" width="390" height="44"/>
      <text class="label" x="14" y="28">TOPBAR · 44 PX</text>
      <text class="label-faint" x="376" y="28" text-anchor="end">⌘K</text>
    </g>

    <!-- 2. MobileTabs -->
    <g id="mobile-tabs">
      <title>2 · MobileTabs (44 px) · 3 children · 03 active</title>
      <rect class="region" x="0" y="44" width="390" height="44"/>
      <line class="dim-rule" x1="130" y1="44" x2="130" y2="88"/>
      <line class="dim-rule" x1="260" y1="44" x2="260" y2="88"/>
      <text class="label-soft" x="65" y="72" text-anchor="middle">01 LIBRARY</text>
      <text class="label-soft" x="195" y="72" text-anchor="middle">02 SOURCE</text>
      <text class="label" x="325" y="72" text-anchor="middle">03 OUTPUT</text>
      <line class="accent" x1="270" y1="86" x2="380" y2="86" stroke-width="2"/>
    </g>

    <!-- 3. Output head -->
    <g id="output-head">
      <title>3 · Output head (~36 px) · single row · pills + title</title>
      <rect class="region" x="0" y="88" width="390" height="36"/>
      <text class="legend-meta" x="14" y="104">OUT.014</text>
      <text class="h2" x="68" y="111">Extracted Document</text>
      <rect x="252" y="98" width="124" height="20" fill="#fafaf7" stroke="#928d85" stroke-width="0.5"/>
      <text class="label-soft" x="270" y="112">R</text>
      <text class="label-soft" x="298" y="112">S</text>
      <text class="label-soft" x="332" y="112">C</text>
    </g>

    <!-- 4. Output canvas -->
    <g id="output-canvas">
      <title>4 · Output canvas · ≈ 70 % of viewport · scroll-y</title>
      <rect class="canvas" x="0" y="124" width="390" height="590"/>
      <text class="h2" x="20" y="160">Notes on Optical Recognition</text>
      <line class="dim-rule" x1="20" y1="180" x2="370" y2="180"/>
      <line class="dim-rule" x1="20" y1="198" x2="370" y2="198"/>
      <line class="dim-rule" x1="20" y1="216" x2="370" y2="216"/>
      <line class="dim-rule" x1="20" y1="234" x2="280" y2="234"/>
      <line class="dim-rule" x1="20" y1="270" x2="370" y2="270"/>
      <line class="dim-rule" x1="20" y1="288" x2="370" y2="288"/>
      <line class="dim-rule" x1="20" y1="306" x2="320" y2="306"/>
      <line class="dim-rule" x1="20" y1="342" x2="370" y2="342"/>
      <line class="dim-rule" x1="20" y1="360" x2="370" y2="360"/>
      <line class="dim-rule" x1="20" y1="378" x2="370" y2="378"/>
      <line class="dim-rule" x1="20" y1="396" x2="200" y2="396"/>
      <text class="label-faint" x="20" y="690">─ END OF DOCUMENT ─</text>
      <!-- vertical scroll axis indicator -->
      <g id="canvas-scroll-axis">
        <title>scroll axis · y</title>
        <path class="scroll-axis" d="M 372 140 L 372 700"/>
        <polygon class="scroll-axis-arrow" points="372,138 369,144 375,144"/>
        <polygon class="scroll-axis-arrow" points="372,702 369,696 375,696"/>
        <text class="legend-meta" x="376" y="430" transform="rotate(-90 376 430)" text-anchor="middle">SCROLL Y</text>
      </g>
    </g>

    <!-- 5. Foot region (chip strip + prompt) -->
    <g id="output-foot">
      <title>5 · Output foot · clamp(120, 30dvh, 220) · scroll-y if exceeded</title>
      <rect class="region" x="0" y="714" width="390" height="130"/>

      <!-- 5a. ExportBar chip strip -->
      <g id="exports-chipstrip">
        <title>5a · ExportBar chip strip · scroll-x · 9 chips, 3 groups</title>
        <rect class="canvas" x="0" y="714" width="390" height="56"/>
        <!-- group 1 -->
        <rect x="12" y="724" width="48" height="36" fill="#ffffff" stroke="#928d85" stroke-width="0.5"/>
        <rect x="64" y="724" width="64" height="36" fill="#ffffff" stroke="#928d85" stroke-width="0.5"/>
        <rect x="132" y="724" width="46" height="36" fill="#ffffff" stroke="#928d85" stroke-width="0.5"/>
        <line class="dim-rule" x1="186" y1="724" x2="186" y2="760"/>
        <!-- group 2 -->
        <rect x="194" y="724" width="50" height="36" fill="#ffffff" stroke="#928d85" stroke-width="0.5"/>
        <rect x="248" y="724" width="50" height="36" fill="#ffffff" stroke="#928d85" stroke-width="0.5"/>
        <rect x="302" y="724" width="46" height="36" fill="#ffffff" stroke="#928d85" stroke-width="0.5"/>
        <line class="dim-rule" x1="356" y1="724" x2="356" y2="760"/>
        <!-- group 3 (partially clipped — overflow cue) -->
        <rect x="364" y="724" width="46" height="36" fill="#ffffff" stroke="#928d85" stroke-width="0.5"/>
        <!-- right-edge fade -->
        <rect x="360" y="714" width="30" height="56" fill="url(#fade)" opacity="0.6"/>
        <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#f4f3ee" stop-opacity="0"/>
          <stop offset="1" stop-color="#f4f3ee" stop-opacity="1"/>
        </linearGradient>
        <!-- scroll axis arrow -->
        <path class="scroll-axis" d="M 12 776 L 348 776"/>
        <polygon class="scroll-axis-arrow" points="350,776 344,773 344,779"/>
        <text class="legend-meta" x="180" y="787" text-anchor="middle">SCROLL X · SNAP PROXIMITY</text>
      </g>

      <!-- 5b. PromptDock single row -->
      <g id="prompt-row">
        <title>5b · PromptDock · single row · input + Run</title>
        <rect class="canvas" x="0" y="794" width="390" height="50"/>
        <rect x="12" y="804" width="280" height="30" fill="#ffffff" stroke="#928d85" stroke-width="0.5"/>
        <text class="label-faint" x="22" y="822">ASK ANYTHING…</text>
        <rect x="298" y="804" width="80" height="30" fill="#2b2620"/>
        <text fill="#fafaf7" font-size="10px" x="338" y="822" text-anchor="middle" letter-spacing="0.04em">RUN ↵</text>
      </g>
    </g>

    <!-- Safe-area-inset-bottom indicator -->
    <g id="safe-area">
      <title>safe-area-inset-bottom · iPhone home indicator</title>
      <rect x="100" y="844" width="190" height="0" fill="none"/>
      <line class="accent" x1="100" y1="844" x2="290" y2="844" stroke-dasharray="3 3" stroke-width="1"/>
      <text class="legend-meta" x="195" y="858" text-anchor="middle">env(safe-area-inset-bottom)</text>
    </g>

    <!-- Annotation pins -->
    <g id="pins">
      <circle class="pin" cx="-14" cy="22" r="11"/>
      <text class="pin-text" x="-14" y="22">1</text>
      <circle class="pin" cx="-14" cy="66" r="11"/>
      <text class="pin-text" x="-14" y="66">2</text>
      <circle class="pin" cx="-14" cy="106" r="11"/>
      <text class="pin-text" x="-14" y="106">3</text>
      <circle class="pin" cx="-14" cy="420" r="11"/>
      <text class="pin-text" x="-14" y="420">4</text>
      <circle class="pin" cx="-14" cy="742" r="11"/>
      <text class="pin-text" x="-14" y="742">5a</text>
      <circle class="pin" cx="-14" cy="819" r="11"/>
      <text class="pin-text" x="-14" y="819">5b</text>
    </g>
  </g>

  <!-- ──────────── Legend (right side) ──────────── -->
  <g id="legend" transform="translate(450, 32)">
    <text class="h2" x="0" y="0" font-style="normal" font-weight="500">Mobile · Output v2</text>
    <text class="label-faint" x="0" y="20">PHONE PORTRAIT · 390 × 844 · DVH</text>

    <line class="dim-rule" x1="0" y1="36" x2="240" y2="36"/>

    <text class="legend-row" x="0" y="60"><tspan class="legend-meta">1</tspan>  TopBar · 44 px</text>
    <text class="legend-row" x="0" y="80"><tspan class="legend-meta">2</tspan>  MobileTabs · 44 px · 03 active</text>
    <text class="legend-row" x="0" y="100"><tspan class="legend-meta">3</tspan>  Output head · ~36 px</text>
    <text class="legend-row" x="0" y="120"><tspan class="legend-meta">4</tspan>  Canvas · ≈ 70 % · scroll-y</text>
    <text class="legend-row" x="0" y="140"><tspan class="legend-meta">5a</tspan> Chip strip · ~56 px · scroll-x</text>
    <text class="legend-row" x="0" y="160"><tspan class="legend-meta">5b</tspan> Prompt · ~50 px · single row</text>

    <line class="dim-rule" x1="0" y1="180" x2="240" y2="180"/>

    <text class="label-faint" x="0" y="204">VIEWPORT BUDGET</text>
    <text class="legend-row" x="0" y="224">chrome (top): 124 px (15 %)</text>
    <text class="legend-row" x="0" y="244">canvas: 590 px (70 %)</text>
    <text class="legend-row" x="0" y="264">foot: 130 px (15 %)</text>
    <text class="legend-row" x="0" y="284">total: 844 px (100 %)</text>

    <line class="dim-rule" x1="0" y1="304" x2="240" y2="304"/>

    <text class="label-faint" x="0" y="328">SCROLL OWNERSHIP</text>
    <text class="legend-row" x="0" y="348">canvas → overflow-y: auto</text>
    <text class="legend-row" x="0" y="368">foot → overflow-y: auto</text>
    <text class="legend-row" x="0" y="388">chips → overflow-x: auto</text>
    <text class="legend-row" x="0" y="408">overscroll-behavior: contain</text>

    <line class="dim-rule" x1="0" y1="428" x2="240" y2="428"/>

    <text class="label-faint" x="0" y="452">FILES</text>
    <text class="legend-row" x="0" y="472">tokens · mobile-output-tokens.css</text>
    <text class="legend-row" x="0" y="492">spec · MOBILE_REDESIGN_SPEC.md</text>
    <text class="legend-row" x="0" y="512">mockup · mobile-output-v2.html</text>
    <text class="legend-row" x="0" y="532">flows · mobile-upload-flows.html</text>
  </g>
</svg>
